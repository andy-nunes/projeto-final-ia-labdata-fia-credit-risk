services:
  dev:
    build:
      context: .
    image: fia-credit-risk-dev
    working_dir: /app
    volumes:
      - .:/app
      - ${HOME}/.kaggle:/root/.kaggle:ro
    environment:
      KAGGLE_CONFIG_DIR: /root/.kaggle
      PYTHONPATH: /app
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: bash
    stdin_open: true
    tty: true
    depends_on:
      - minio

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: fia-credit-risk-airflow
    hostname: airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__HOSTNAME_CALLABLE: scripts.airflow_config.get_airflow_hostname
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__API__SECRET_KEY: fia-credit-risk-local-dev
      AIRFLOW_CONN_MINIO_DEFAULT: aws://minioadmin:minioadmin@?host=http%3A%2F%2Fminio%3A9000
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_KEY: minioadmin
      MINIO_SECRET: minioadmin
      ARTIFACTS_PATH: s3://artifacts
      ABT_PATH: s3://abt/abt_train.parquet
      MODEL_PATH: s3://artifacts/lightgbm_hcdr.pkl
      MODEL_METADATA_PATH: s3://artifacts/model_metadata.json
      DATA_DIR: /opt/airflow/Dados
      AIRFLOW_HOSTNAME: airflow
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./app:/opt/airflow/app:ro
      - ./tests:/opt/airflow/tests:ro
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./Dados:/opt/airflow/Dados
      - ./config:/opt/airflow/config
      - ./artifacts:/opt/airflow/artifacts
      - ${HOME}/.kaggle:/home/airflow/.kaggle:ro
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
      airflow dags reserialize &&
      exec airflow standalone"
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
      - ./Dados:/Dados
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  minio-client:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 minioadmin minioadmin && exec mc "$@"
      - mc
    command: ["--help"]
    volumes:
      - ./Dados:/Dados
    depends_on:
      - minio

  api:
    build:
      context: .
    image: fia-credit-risk-dev
    working_dir: /app
    environment:
      DATA_DIR: /app/Dados
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MODEL_PATH: s3://artifacts/lightgbm_hcdr.pkl
      MODEL_METADATA_PATH: s3://artifacts/model_metadata.json
    volumes:
      - .:/app
      - ./Dados:/app/Dados
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - minio

  streamlit:
    build:
      context: .
    image: fia-credit-risk-dev
    working_dir: /app
    environment:
      DATA_DIR: /app/Dados
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      API_BASE_URL: http://api:8000
      API_BROWSER_BASE_URL: http://localhost:8000
    volumes:
      - .:/app
      - ./Dados:/app/Dados
    ports:
      - "8501:8501"
    restart: unless-stopped
    command: >
      bash -c "python scripts/ensure_minio_buckets.py &&
      streamlit run app/dashboard.py --server.address=0.0.0.0 --server.port=8501
      --server.fileWatcherType none"
    depends_on:
      - minio
      - api

volumes:
  minio_data:
