services:
  dev:
    build:
      context: .
    image: fia-credit-risk-dev
    working_dir: /app
    volumes:
      - .:/app
      - ${HOME}/.kaggle:/root/.kaggle:ro
    environment:
      KAGGLE_CONFIG_DIR: /root/.kaggle
      PYTHONPATH: /app
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: bash
    stdin_open: true
    tty: true
    depends_on:
      - minio

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: fia-credit-risk-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__API__SECRET_KEY: fia-credit-risk-local-dev
      AIRFLOW_CONN_MINIO_DEFAULT: aws://minioadmin:minioadmin@?host=http%3A%2F%2Fminio%3A9000
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      DATA_DIR: /opt/airflow/Dados
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./Dados:/opt/airflow/Dados
      - ${HOME}/.kaggle:/home/airflow/.kaggle:ro
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
      exec airflow standalone"
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
      - ./Dados:/Dados
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  streamlit:
    build:
      context: .
    image: fia-credit-risk-dev
    working_dir: /app
    environment:
      DATA_DIR: /app/Dados
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - .:/app
      - ./Dados:/app/Dados
    ports:
      - "8501:8501"
    command: >
      bash -c "python scripts/ensure_minio_buckets.py &&
      streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501"
    depends_on:
      - minio

volumes:
  minio_data:
