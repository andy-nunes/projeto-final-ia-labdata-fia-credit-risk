services:
  dev:
    build:
      context: .
    image: fia-credit-risk-dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: bash
    stdin_open: true
    tty: true
    depends_on:
      - minio

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: fia-credit-risk-airflow
    hostname: airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__HOSTNAME_CALLABLE: scripts.airflow_config.get_airflow_hostname
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_SIMPLE_AUTH_MANAGER_USERS:-admin:admin}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__API__SECRET_KEY: fia-credit-risk-local-dev
      AIRFLOW_CONN_MINIO_DEFAULT: ${AIRFLOW_CONN_MINIO_DEFAULT:-aws://minioadmin:minioadmin@?host=http%3A%2F%2Fminio%3A9000}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_KEY: ${MINIO_KEY:-minioadmin}
      MINIO_SECRET: ${MINIO_SECRET:-minioadmin}
      ABT_PATH: s3://abt/abt_train.parquet
      DEMO_HOLDOUT_PATH: s3://abt/abt_demo_holdout.parquet
      MODEL_PATH: s3://artifacts/lightgbm_hcdr.pkl
      MODEL_METADATA_PATH: s3://artifacts/model_metadata.json
      API_HEALTH_URL: http://api:8000/
      DATA_DIR: /opt/airflow/Dados
      AIRFLOW_HOSTNAME: airflow
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config:ro
      - ./app:/opt/airflow/app:ro
      - ./tests:/opt/airflow/tests:ro
      - ./pytest.ini:/opt/airflow/pytest.ini:ro
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./Dados:/opt/airflow/Dados
      - ./Model:/opt/airflow/Model
      - ./DataPipeline:/opt/airflow/DataPipeline:ro
      - ./artifacts:/opt/airflow/artifacts
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
      airflow dags reserialize &&
      airflow dags unpause 01_bronze_ingest_kaggle &&
      airflow dags unpause 02_silver_clean_data &&
      airflow dags unpause 03_gold_abt_features &&
      airflow dags unpause 04_model_train_lightgbm &&
      airflow dags unpause 05_monitor_health &&
      exec airflow standalone"
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
      - ./Dados:/Dados
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  minio-client:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 minioadmin minioadmin && exec mc "$@"
      - mc
    command: ["--help"]
    volumes:
      - ./Dados:/Dados
    depends_on:
      - minio

  api:
    build:
      context: .
    image: fia-credit-risk-dev
    working_dir: /app
    env_file:
      - path: ./.env
        required: false
    environment:
      DATA_DIR: /app/Dados
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ABT_PATH: s3://abt/abt_train.parquet
      DEMO_HOLDOUT_PATH: s3://abt/abt_demo_holdout.parquet
      MODEL_PATH: s3://artifacts/lightgbm_hcdr.pkl
      MODEL_METADATA_PATH: s3://artifacts/model_metadata.json
    volumes:
      - .:/app
      - ./Dados:/app/Dados
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - minio

  streamlit:
    build:
      context: .
    image: fia-credit-risk-dev
    working_dir: /app
    environment:
      PYTHONPATH: /app
      DATA_DIR: /app/Dados
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ABT_PATH: s3://abt/abt_train.parquet
      DEMO_HOLDOUT_PATH: s3://abt/abt_demo_holdout.parquet
      MODEL_PATH: s3://artifacts/lightgbm_hcdr.pkl
      MODEL_METADATA_PATH: s3://artifacts/model_metadata.json
      API_BASE_URL: http://api:8000
      API_BROWSER_BASE_URL: http://localhost:8000
    volumes:
      - .:/app
      - ./Dados:/app/Dados
    ports:
      - "8501:8501"
    restart: unless-stopped
    command: >
      bash -c "python scripts/ensure_minio_buckets.py &&
      streamlit run app/dashboard.py --server.address=0.0.0.0 --server.port=8501
      --server.fileWatcherType none"
    depends_on:
      - minio
      - api

volumes:
  minio_data:
